[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The distribution name, which is not the import name: `import zpf` is unchanged.
# `zpf` on PyPI belongs to an unrelated project, so depending on `zpf` invited a
# dependency-confusion install (#102). `src/zpf/__init__.py` looks the version up
# by this name, and `test_package.py` holds the two together.
name = "python-zipline"
# The single source of truth for the library's version. `zpf.__version__`
# reads it back out of the installed metadata; nothing else states it.
# This counter is the library's own — it is not the spec version, which
# `zpf.SPEC_VERSION` states — but it follows the same rule the format does:
# while we are in 0.x, every minor is a break with no upgrade path promised.
version = "0.8.0"
description = "A Python implementation of the Zipline Payload Format (.zpf)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Adam Jonsson", email = "akj426@gmail.com" }]
classifiers = [
    # The format itself is 0.x and explicitly not production-ready, so the
    # package page should not promise more than the README does.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]

[project.scripts]
zpf = "zpf.cli:main"

[project.urls]
Specification = "https://github.com/adamkjonsson/zipline/blob/v0.24/docs/zipline-payload-format.md"
Changelog = "https://github.com/adamkjonsson/python-zipline/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/zpf"]

# An explicit list, so the sdist does not depend on what happens to be in the
# working tree: without one, hatchling packs every file the project's
# .gitignore does not exclude, untracked ones and caches included.
[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "plans",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "VECTOR-DEFECTS.md",
    "requirements.txt",
]
exclude = [".hypothesis", "docs/_build", "__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
