[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zpf"
# The single source of truth for the library's version. `zpf.__version__`
# reads it back out of the installed metadata; nothing else states it.
# This counter is the library's own — it is not the spec version, which
# `zpf.SPEC_VERSION` states — but it follows the same rule the format does:
# while we are in 0.x, every minor is a break with no upgrade path promised.
version = "0.2.0.dev0"
description = "A Python implementation of the Zipline Payload Format (.zpf)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Adam Jonsson", email = "akj426@gmail.com" }]
classifiers = [
    # The format itself is 0.x and explicitly not production-ready, so the
    # package page should not promise more than the README does.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]

[project.scripts]
zpf = "zpf.cli:main"

[project.urls]
Specification = "https://github.com/adamkjonsson/zipline/blob/v0.16/docs/zipline-payload-format.md"
Changelog = "https://github.com/adamkjonsson/python-zipline/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/zpf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
