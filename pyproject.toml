[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zpf"
description = "A Python implementation of the Zipline Payload Format (.zpf)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Adam Jonsson", email = "akj426@gmail.com" }]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]

[project.scripts]
zpf = "zpf.cli:main"

[project.urls]
Specification = "https://github.com/adamkjonsson/zipline/blob/v0.9/docs/payload-format.md"

[tool.hatch.version]
path = "src/zpf/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zpf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
